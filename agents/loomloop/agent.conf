# AgentDorm agent descriptor -- sourced by lib/agent.sh. Plain KEY=value.
AGENT_TITLE="LoomLoop"
AGENT_UPSTREAM="https://github.com/ismaelfaro/loomloop"
AGENT_IMAGE="loomloop:local"
# No web UI: `run` executes in the foreground; a resident runs each message in
# its dorm inbox as a LoomLoop system (a script with main(), `run <path>`, or
# `demo`) and replies with the result.
AGENT_KIND="worker"
AGENT_STATE_MOUNT="/loomloop"
AGENT_DEPS_MOUNT=""
AGENT_WORKSPACE_MOUNTS="/workspace"
AGENT_CMD=""
AGENT_UID=1000
AGENT_FINGERPRINT_FILES="Dockerfile entrypoint.sh agent-task"
# LOOMLOOP_BACKEND=claude + ANTHROPIC_API_KEY for model-backed BrainLoops.
AGENT_ENV="ANTHROPIC_API_KEY LOOMLOOP_BACKEND LOOMLOOP_MODEL"
# A library for weaving agents, not an agent with a persona.
AGENT_IDENTITY="none-needed"
