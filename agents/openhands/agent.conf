# AgentDorm agent descriptor -- sourced by lib/agent.sh. Plain KEY=value.
AGENT_TITLE="OpenHands Agent Canvas"
AGENT_UPSTREAM="https://github.com/OpenHands/OpenHands"
AGENT_IMAGE="openhands-web:local"
AGENT_PORT=8000
AGENT_CONTAINER_PORT=8000
AGENT_URL_PATH="/canvas"
AGENT_STATE_MOUNT="/home/openhands/.openhands"
# Wraps the official image, which installs nothing at runtime: no deps mount.
AGENT_DEPS_MOUNT=""
# /projects is the path Agent Canvas browses.
AGENT_WORKSPACE_MOUNTS="/projects"
# The image's own entrypoint needs no command.
AGENT_CMD=""
AGENT_UID=1000
AGENT_FINGERPRINT_FILES="Dockerfile entrypoint.sh"
AGENT_ENV="NOUS_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY OPENROUTER_API_KEY OPENROUTER_BASE_URL DEEPSEEK_API_KEY GEMINI_API_KEY MINIMAX_API_KEY"
# Agent Canvas keeps its persona in UI settings; nothing to seed from a file.
AGENT_IDENTITY="none"
