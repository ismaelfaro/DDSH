# AgentDorm agent descriptor -- sourced by lib/agent.sh. Plain KEY=value.
AGENT_TITLE="nanoLoop"
AGENT_UPSTREAM="https://github.com/ismaelfaro/nanoLoop"
AGENT_IMAGE="nanoloop:local"
# No web UI: `run` executes one task in the foreground; a resident takes each
# message in its dorm inbox as a task (dorm/dorm-worker) and replies.
AGENT_KIND="worker"
AGENT_STATE_MOUNT="/nanoloop"
AGENT_DEPS_MOUNT=""
AGENT_WORKSPACE_MOUNTS="/workspace"
# Sessions are written relative to the working dir, so work from the state.
AGENT_WORKDIR="/nanoloop"
AGENT_CMD=""
AGENT_UID=1000
AGENT_FINGERPRINT_FILES="Dockerfile entrypoint.sh agent-task"
AGENT_ENV="OPENROUTER_API_KEY HARNESS_MODEL HARNESS_SUBAGENT_MODEL HARNESS_MAX_TOKENS HARNESS_MAX_RETRIES HARNESS_FALLBACK_MODEL HARNESS_HITL OPENROUTER_SITE_URL OPENROUTER_APP_NAME"
AGENT_IDENTITY="nanoloop-memory"
