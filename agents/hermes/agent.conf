# AgentDorm agent descriptor -- sourced by lib/agent.sh. Plain KEY=value.
AGENT_TITLE="Hermes Agent"
AGENT_UPSTREAM="https://github.com/NousResearch/hermes-agent"
AGENT_IMAGE="hermes-web:local"
AGENT_PORT=9119
AGENT_CONTAINER_PORT=19119
AGENT_URL_PATH="/"
AGENT_STATE_MOUNT="/hermes"
AGENT_DEPS_MOUNT="/opt/hermes"
# /home/hermes too: HOME is the launch folder, so files written to `~` (or by
# tools that start in HOME) land where the user can see them.
AGENT_WORKSPACE_MOUNTS="/workspace /home/hermes"
AGENT_CMD="dashboard"
AGENT_UID=1000
AGENT_FINGERPRINT_FILES="Dockerfile entrypoint.sh configure-model.sh"
AGENT_ENV="NOUS_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY OPENROUTER_API_KEY OPENROUTER_BASE_URL DEEPSEEK_API_KEY GEMINI_API_KEY MINIMAX_API_KEY HERMES_PROVIDER HERMES_MODEL HERMES_MODELS HERMES_MODEL_PREFER HERMES_MODEL_REWRITE HERMES_BASE_URL HERMES_CONTEXT_LENGTH HERMES_FALLBACKS"
AGENT_IDENTITY="soul-in-state"
