# AgentDorm agent descriptor -- sourced by lib/agent.sh. Plain KEY=value.
AGENT_TITLE="DeepSeek Harness"
AGENT_UPSTREAM="https://github.com/deepseek-ai/deepseek-harness"
AGENT_IMAGE="dsh-web:local"
# Host port a plain `agentdorm run dsh` starts from (auto-bumped when busy).
AGENT_PORT=3080
# Container port published to the host: the socat bridge in entrypoint.sh.
AGENT_CONTAINER_PORT=13080
AGENT_URL_PATH="/"
# Persistent state ($DSH_HOME) and the seeded dependency tree.
AGENT_STATE_MOUNT="/dsh"
AGENT_DEPS_MOUNT="/opt/dsh"
# Where the launch folder is mounted; the first entry is the working dir.
AGENT_WORKSPACE_MOUNTS="/workspace"
AGENT_CMD="web"
AGENT_UID=1000
AGENT_FINGERPRINT_FILES="Dockerfile entrypoint.sh"
AGENT_ENV="DEEPSEEK_API_KEY OPENROUTER_API_KEY OPENROUTER_BASE_URL OPENROUTER_MODELS DSH_TRUSTED_HOSTS"
# How a resident's description becomes this agent's identity (see lib/identity.sh).
AGENT_IDENTITY="dsh-persona"
