# AgentDorm agent descriptor -- sourced by lib/agent.sh. Plain KEY=value.
AGENT_TITLE="OpenClaw"
AGENT_UPSTREAM="https://github.com/openclaw/openclaw"
AGENT_IMAGE="openclaw-web:local"
AGENT_PORT=18789
AGENT_CONTAINER_PORT=18790
# The Control UI authenticates with a token in the URL fragment; `agentdorm url`
# asks the gateway for it.
AGENT_URL_PATH="/"
AGENT_STATE_MOUNT="/openclaw"
AGENT_DEPS_MOUNT="/opt/openclaw"
AGENT_WORKSPACE_MOUNTS="/workspace"
AGENT_CMD="gateway"
AGENT_UID=1000
AGENT_FINGERPRINT_FILES="Dockerfile entrypoint.sh"
AGENT_ENV="NOUS_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY OPENROUTER_API_KEY OPENROUTER_BASE_URL DEEPSEEK_API_KEY GEMINI_API_KEY MINIMAX_API_KEY"
AGENT_IDENTITY="soul-in-workspace"
